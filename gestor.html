<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Gestor — Secretaria de Saúde</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface-2:#f8fafc;--border:#e2e8f0;--txt-1:#0f172a;--txt-2:#334155;--txt-3:#64748b;--font-body:'Inter',system-ui,sans-serif;--shadow-sm:0 1px 3px rgba(0,0,0,.07);--shadow-xl:0 20px 25px rgba(0,0,0,.10);--musgo:#2e7d32;--musgo-escuro:#1b5e20}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--txt-1);font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.58rem 1.25rem;border-radius:9px;border:none;font-family:var(--font-body);font-size:.83rem;font-weight:600;cursor:pointer}
.btn-salvar{background:linear-gradient(135deg,#263238,#455a64);color:#fff}
.btn-nova{background:var(--surface);color:var(--txt-2);border:1.5px solid var(--border)}
.btn:disabled{opacity:.6;cursor:wait}
.ag-mini{padding:.35rem .75rem;font-size:.78rem;margin:0}
.tabela-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
.app-header{background:linear-gradient(135deg,#263238,#455a64);color:#fff;padding:.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;min-height:56px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.app-header-brand{display:flex;align-items:center;gap:.75rem}
.app-header-icon{font-size:1.5rem;background:rgba(255,255,255,.15);width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.app-header-text strong{display:block;font-size:1rem}.app-header-text span{font-size:.72rem;opacity:.8}
.btn-portal-voltar{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:.45rem 1rem;border-radius:9px;font-family:var(--font-body);font-weight:600;font-size:.8rem;cursor:pointer}
.gst-user{display:flex;align-items:center;gap:.7rem;font-size:.8rem}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#263238;color:#fff;padding:.8rem 1.25rem;border-radius:12px;font-weight:600;font-size:.85rem;box-shadow:var(--shadow-xl);z-index:9999;display:none}
.toast.show{display:block}.toast.erro{background:#c62828}
/* login */
#tela-login-g{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:linear-gradient(150deg,#1a252b,#263238 45%,#455a64)}
.lg-card{background:#fff;border-radius:22px;padding:2.25rem 2rem;width:100%;max-width:400px;box-shadow:0 32px 64px rgba(0,0,0,.35)}
.lg-top{text-align:center;margin-bottom:1.4rem}.lg-ico{font-size:2.4rem}
.lg-top h1{font-size:1.2rem;margin-top:.4rem;color:#263238}.lg-top p{font-size:.78rem;color:var(--txt-3);margin-top:.25rem}
.lg-card label{display:block;font-size:.68rem;font-weight:700;color:var(--txt-2);text-transform:uppercase;letter-spacing:.5px;margin:.9rem 0 .3rem}
.lg-card input{width:100%;padding:.75rem .9rem;border:1.5px solid var(--border);border-radius:10px;font-family:var(--font-body);font-size:16px}
.lg-card input:focus{outline:none;border-color:#455a64}
.lg-erro{display:none;background:#ffebee;color:#c62828;border-radius:9px;padding:.6rem .8rem;font-size:.8rem;font-weight:600;margin-top:.9rem}
.lg-btn{width:100%;justify-content:center;margin-top:1.2rem;padding:.85rem;font-size:.92rem}
.lg-rodape{margin-top:1.1rem;font-size:.7rem;color:var(--txt-3);text-align:center}
#tela-painel-g{display:none}
@media(max-width:640px){.app-header{padding:.5rem .85rem}.app-header-text strong{font-size:.95rem}.lg-card{padding:1.75rem 1.25rem}input,select,textarea{font-size:16px!important}.btn,.btn-portal-voltar{min-height:44px}.toast{left:1rem;right:1rem;bottom:1rem}}
/* ===== PAINEL DO GESTOR ===== */
#modulo-gestor{display:block;min-height:100vh;background:var(--bg)}
.gst-content{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 3rem}
.gst-filtros{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.gst-filtros select{padding:.5rem .7rem;border:1.5px solid var(--border);border-radius:9px;font-family:var(--font-body);font-size:.82rem;background:#fff}
.gst-aviso{font-size:.74rem;color:var(--txt-3);margin:.2rem 0 .8rem}
.gst-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.65rem;margin-bottom:1rem}
.gst-kpi{background:#fff;border:1px solid var(--border);border-top:4px solid var(--kc,#455a64);border-radius:12px;padding:.7rem .85rem;text-align:left;font-family:var(--font-body);cursor:pointer;transition:transform .15s,box-shadow .15s}
.gst-kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.gst-kpi b{display:block;font-size:1.65rem;line-height:1.1;color:var(--kc,#263238)}
.gst-kpi span{font-size:.72rem;color:var(--txt-2);font-weight:600}
.gst-kpi small{display:block;font-size:.66rem;color:var(--txt-3);margin-top:.15rem}
.gst-card{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:1rem;overflow:hidden}
.gst-card>h3{margin:0;padding:.7rem 1rem;background:#eceff1;color:#263238;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.gst-card-c{padding:.9rem 1rem}
.gst-barra{display:grid;grid-template-columns:150px 1fr 92px;gap:.6rem;align-items:center;margin:.45rem 0;font-size:.8rem}
.gst-trilho{background:#eceff1;border-radius:20px;height:16px;position:relative;overflow:hidden}
.gst-fill{height:100%;border-radius:20px;transition:width .5s}
.gst-barra small{color:var(--txt-3);font-size:.7rem;text-align:right}
.gst-tab{width:100%;border-collapse:collapse;font-size:.8rem}
.gst-tab th{background:#f5f7f8;color:#37474f;text-align:right;padding:.5rem .6rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;position:sticky;top:0}
.gst-tab th:first-child,.gst-tab td:first-child{text-align:left}
.gst-tab td{padding:.5rem .6rem;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
.gst-tab tr.gst-sub td{background:#fafafa;font-weight:700}
.gst-tab td button{background:none;border:none;color:#0277bd;font-weight:800;cursor:pointer;font-family:var(--font-body);font-size:.82rem;padding:0 .2rem}
.gst-pill{display:inline-block;padding:.12rem .55rem;border-radius:20px;font-size:.7rem;font-weight:700}
.gst-ok{background:#e8f5e9;color:#2e7d32}.gst-med{background:#fff8e1;color:#f57f17}.gst-ruim{background:#ffebee;color:#c62828}.gst-nd{background:#eceff1;color:#607d8b}
.gst-metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.gst-metas label{font-size:.68rem;font-weight:700;color:var(--txt-2);text-transform:uppercase;display:block;margin-bottom:.2rem}
.gst-metas input{width:100%;padding:.45rem .6rem;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font-body);font-size:.85rem}
.gst-vazio{color:var(--txt-3);font-size:.82rem;padding:1rem;text-align:center}
.gst-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem}
.gst-ov.aberto{display:flex}
.gst-modal{background:#fff;border-radius:16px;width:100%;max-width:980px;max-height:92vh;max-height:92dvh;overflow:auto;padding:1.1rem 1.25rem}
.gst-modal-top{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.7rem}
.gst-modal-top h3{margin:0;font-size:1rem;color:#263238}
.gst-modal-top div{display:flex;gap:.4rem;flex-wrap:wrap}
@media(max-width:640px){.gst-barra{grid-template-columns:1fr;gap:.2rem}.gst-barra small{text-align:left}.gst-kpi b{font-size:1.4rem}.gst-filtros select{flex:1 1 45%}.gst-modal{padding:.9rem .8rem}}


@media print{.app-header,.gst-filtros{display:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="tela-login-g">
  <div class="lg-card">
    <div class="lg-top"><div class="lg-ico">📊</div><h1>Painel do Gestor</h1><p>Secretaria de Saúde de Alto Alegre do Maranhão<br>Acesso restrito à gestão</p></div>
    <form onsubmit="gstLogin();return false" autocomplete="on">
      <label for="lg-user">Usuário</label>
      <input type="text" id="lg-user" autocomplete="username" autocapitalize="none" placeholder="usuário do gestor">
      <label for="lg-pass">Senha</label>
      <input type="password" id="lg-pass" autocomplete="current-password" placeholder="••••••••">
      <div class="lg-erro" id="lg-erro"></div>
      <button type="submit" class="btn btn-salvar lg-btn" id="lg-btn">Entrar no painel →</button>
    </form>
    <div class="lg-rodape">Este acesso é separado do sistema das equipes.</div>
  </div>
</div>

<div id="tela-painel-g">
<div id="modulo-gestor">
  <div class="app-header" style="background:linear-gradient(135deg,#263238,#455a64)">
    <div class="app-header-brand">
      <div class="app-header-icon">📊</div>
      <div class="app-header-text">
        <strong>Painel do Gestor</strong>
        <span>Cobertura · atrasos · faltosos · retornos · metas</span>
      </div>
    </div>
    <div class="gst-user"><span id="gst-nome-user"></span><button class="btn-portal-voltar" onclick="gstSair()">Sair</button></div>
  </div>
  <div class="gst-content">
    <div class="gst-filtros">
      <select id="gst-f-prog" title="Programa" onchange="gstRender()"><option value="">Todos os programas</option></select>
      <select id="gst-f-equipe" title="Equipe" onchange="gstRender()"><option value="">Todas as equipes</option></select>
      <select id="gst-f-micro" title="Microárea" onchange="gstRender()"><option value="">Todas as microáreas</option></select>
      <button type="button" class="btn btn-nova ag-mini" onclick="gstCarregar()">↻ Atualizar</button>
      <button type="button" class="btn btn-nova ag-mini" onclick="gstImprimir()">🖨️ Imprimir painel</button>
      <button type="button" class="btn btn-nova ag-mini" onclick="gstExportar('todos')">📥 Exportar Excel</button>
    </div>
    <div class="gst-aviso" id="gst-aviso">Carregando…</div>
    <div id="gst-corpo"><p class="gst-vazio">Carregando indicadores…</p></div>
  </div>
  <div class="gst-ov" id="gst-ov"><div class="gst-modal" id="gst-modal"></div></div>
</div>

</div>

<script>
const SUPABASE_URL='https://kqielgdslxjtykgqjmfg.supabase.co';
const SUPABASE_KEY='sb_publishable_JowP-KiU83uoh8bL8r_OuA_lEyqXmSc';
// sessão própria: não mistura com o login do sistema das equipes
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'aps-gestor-auth',persistSession:true,autoRefreshToken:true}});
const APS_EMAIL_DOMINIO='sistemaaps.local';
function showToast(msg,isError){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(isError?' erro':'');clearTimeout(showToast._t);showToast._t=setTimeout(()=>{t.className='toast';},3500);}
const EG_TOTAIS={his:233,dia:112,ido:397,cri:191,ges:28};
function palEsc(v){return String(v===null||v===undefined?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function gestSit(g){return (g&&g.situacao)||'gestante';}
function gestAtiva(g){return gestSit(g)==='gestante';}
function gestHoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function gestDias(iso){if(!iso)return null;const a=new Date(String(iso).slice(0,10)+'T12:00:00'),b=new Date(gestHoje()+'T12:00:00');return Math.round((b-a)/86400000);}
function gestFmt(d){return d?String(d).slice(0,10).split('-').reverse().join('/'):'—';}
function criIdadeAnos(nasc){
  if(!nasc)return null;const n=new Date(String(nasc).slice(0,10)+'T12:00:00');if(isNaN(n))return null;
  const h=new Date();let a=h.getFullYear()-n.getFullYear();
  if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))a--;return a;
}
function criAtiva(c){const a=criIdadeAnos(c&&c.nascimento);return a===null||a<6;}
function idoSit(i){return (i&&i.situacao)||'ativo';}
function idoAtivo(i){return idoSit(i)==='ativo';}
// ===== PAINEL DO GESTOR =====
const GST_PROG={gestante:['🤰','Gestantes'],crianca:['🧒','Crianças'],hasdm:['❤️','HAS / DM'],idoso:['👴','Idosos'],bucal:['🦷','Saúde Bucal']};
let gstRaw=null,gstRecs=[],gstAg=[],gstMontado=false,gstListaAtual=[];
const GST_METAS_PAD={his:EG_TOTAIS.his,dia:EG_TOTAIS.dia,ido:EG_TOTAIS.ido,cri:EG_TOTAIS.cri,ges:EG_TOTAIS.ges,buc:0,emdia:90,cobertura:80};
function gstMetas(){
  let m={};try{m=JSON.parse(localStorage.getItem('aps_gestor_metas')||'{}')||{};}catch(e){}
  return Object.assign({},GST_METAS_PAD,m);
}
function gstSalvarMetas(){
  const m={};Object.keys(GST_METAS_PAD).forEach(k=>{const el=document.getElementById('gst-m-'+k);if(el&&el.value!==''){const n=parseFloat(el.value);if(!isNaN(n)&&n>=0)m[k]=n;}});
  try{localStorage.setItem('aps_gestor_metas',JSON.stringify(m));}catch(e){}
  showToast('🎯 Metas salvas neste aparelho');gstRender();
}
function gstResetMetas(){try{localStorage.removeItem('aps_gestor_metas');}catch(e){}gstRender();}
function gstEsc(x){return palEsc(x==null?'':String(x));}
function gstRiscoNorm(v){
  const t=String(v||'').toLowerCase();
  if(!t)return '';
  if(/muito|alto|compartilhad|maternidad/.test(t))return 'alto';
  if(/intermedi|moder|m[eé]dio|vigil/.test(t))return 'medio';
  if(/habitual|baixo/.test(t))return 'baixo';
  return '';
}
const GST_RISCO_TXT={alto:'Alto',medio:'Médio',baixo:'Baixo','':'—'};
async function gstTudo(tab){
  let out=[],de=0;
  for(;;){
    const r=await supabaseClient.from(tab).select('*').order('id',{ascending:true}).range(de,de+999);
    if(r.error)return {data:out,error:r.error};
    const d=r.data||[];out=out.concat(d);
    if(d.length<1000)break;de+=1000;
  }
  return {data:out};
}
// uma ficha por paciente (a mais recente entre as ativas); quem não está ativo fica de fora
function gstPorPaciente(rows,getNome,ativo,fn){
  const mapa={},fora={};
  rows.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))||(+b.id||0)-(+a.id||0)).forEach(r=>{
    const n=(getNome(r)||'').trim().toLowerCase();if(!n)return;
    if(ativo(r)){if(!mapa[n])mapa[n]=fn(r);}else fora[n]=1;
  });
  const saiu=Object.keys(fora).filter(n=>!mapa[n]).length;
  return {lista:Object.keys(mapa).map(k=>mapa[k]),saiu};
}
function gstConstruir(){
  const R=gstRaw,rec=(prog,r,nome,equipe,micro,risco,ret,extra)=>Object.assign({prog,id:String(r.id),nome,equipe:equipe||'Sem equipe',micro:micro||'—',risco:gstRiscoNorm(risco),retorno:r?String(ret||'').slice(0,10):''},extra||{});
  const g=gstPorPaciente(R.gestantes,r=>r.nome,gestAtiva,r=>rec('gestante',r,r.nome,r.equipe_esf,'',r.risco_classificacao,r.proxima_consulta));
  const c=gstPorPaciente(R.extratifica,r=>r.crianca,criAtiva,r=>rec('crianca',r,r.crianca,r.equipe_esf,r.microarea,r.risco,r.data_retorno));
  const h=gstPorPaciente(R.hasdm,r=>r.nome,()=>true,r=>rec('hasdm',r,r.nome,r.equipe_esf,r.microarea,r.risco_estratificado,r.data_retorno,{diag:String(r.diagnostico||'').toUpperCase()}));
  const i=gstPorPaciente(R.idosos,r=>r.nome,idoAtivo,r=>rec('idoso',r,r.nome,r.equipe_esf,r.microarea,r.risco,r.data_retorno));
  const b=gstPorPaciente(R.saudebucal,r=>r.nome_civil||r.nome_social,()=>true,r=>rec('bucal',r,r.nome_civil||r.nome_social,r.equipe_esf,r.microarea,r.risco,r.data_retorno));
  gstRecs=[].concat(g.lista,c.lista,h.lista,i.lista,b.lista);
  gstSaiu={ges:g.saiu,cri:c.saiu,ido:i.saiu};
  // equipe/microárea de cada paciente (para ligar a agenda)
  const eq={};
  const reg=(prog,rows,fe)=>rows.forEach(r=>{eq[prog+':'+r.id]={equipe:r.equipe_esf||'Sem equipe',micro:fe?fe(r):(r.microarea||'—')};});
  reg('gestante',R.gestantes,()=>'—');reg('crianca',R.extratifica);reg('hasdm',R.hasdm);reg('idoso',R.idosos);reg('bucal',R.saudebucal);
  const hoje=gestHoje();
  gstAg=(R.agenda||[]).filter(a=>a.status==='faltou'||((a.status==='agendada'||a.status==='confirmada')&&String(a.data).slice(0,10)<hoje)).map(a=>{
    const e=eq[(a.programa||'')+':'+a.paciente_id]||{};
    return {prog:a.programa||'outro',id:String(a.id),nome:a.paciente_nome,equipe:e.equipe||'Sem equipe',micro:e.micro||a.microarea||'—',risco:gstRiscoNorm(a.risco),retorno:String(a.data||'').slice(0,10),ag:a.status==='faltou'?'faltou':'atrasada',status:a.status};
  });
}
let gstSaiu={ges:0,cri:0,ido:0};
function gstClasse(r,hoje){
  if(!r.retorno)return 'semdata';
  if(r.retorno<hoje)return 'atraso';
  const lim=gstSomaDias(hoje,30);
  return r.retorno<=lim?'prox':'emdia';
}
function gstSomaDias(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function gstFiltrar(lista){
  const p=gstEl('gst-f-prog').value,e=gstEl('gst-f-equipe').value,m=gstEl('gst-f-micro').value;
  return lista.filter(r=>(!p||r.prog===p)&&(!e||r.equipe===e)&&(!m||r.micro===m));
}
function gstEl(id){return document.getElementById(id);}
function gstOpcoes(){
  const eqs=[...new Set(gstRecs.concat(gstAg).map(r=>r.equipe))].sort(),ms=[...new Set(gstRecs.concat(gstAg).map(r=>r.micro))].sort((a,b)=>String(a).localeCompare(String(b),'pt',{numeric:true}));
  const f=(id,vals,todas)=>{const el=gstEl(id),v=el.value;el.innerHTML='<option value="">'+todas+'</option>'+vals.map(x=>'<option>'+gstEsc(x)+'</option>').join('');if(vals.indexOf(v)>=0)el.value=v;};
  f('gst-f-equipe',eqs,'Todas as equipes');f('gst-f-micro',ms,'Todas as microáreas');
  const pr=gstEl('gst-f-prog'),pv=pr.value;pr.innerHTML='<option value="">Todos os programas</option>'+Object.keys(GST_PROG).map(k=>'<option value="'+k+'">'+GST_PROG[k][0]+' '+GST_PROG[k][1]+'</option>').join('');pr.value=pv;
}
async function gstAbrir(){
  if(!gstMontado){gstMontado=true;
    document.addEventListener('click',e=>{
      const t=e.target;if(!t||!t.closest)return;
      const b=t.closest('[data-gst]');if(b&&t.closest('#modulo-gestor')){e.preventDefault();gstDetalhe(b.dataset.gst,b.dataset.eq||'',b.dataset.mi||'');return;}
      if(t.id==='gst-ov'||t.closest('[data-gst-fechar]'))gstFechar();
    });
    document.addEventListener('keydown',e=>{if(e.key==='Escape')gstFechar();});
  }
  await gstCarregar();
}
async function gstCarregar(){
  gstEl('gst-aviso').textContent='Carregando dados…';
  gstEl('gst-corpo').innerHTML='<p class="gst-vazio">Carregando indicadores…</p>';
  try{
    const tabs=['gestantes','extratifica','hasdm','idosos','saudebucal','agenda_consultas'];
    const rs=await Promise.all(tabs.map(gstTudo));
    const erro=rs.slice(0,5).find(r=>r.error);
    if(erro){gstEl('gst-corpo').innerHTML='<p class="gst-vazio">Erro ao carregar: '+gstEsc(erro.error.message||'')+'</p>';return;}
    gstRaw={gestantes:rs[0].data,extratifica:rs[1].data,hasdm:rs[2].data,idosos:rs[3].data,saudebucal:rs[4].data,agenda:rs[5].error?[]:rs[5].data};
    gstConstruir();gstOpcoes();gstRender();
  }catch(err){gstEl('gst-corpo').innerHTML='<p class="gst-vazio">Erro ao montar o painel: '+gstEsc(err.message||'')+'</p>';}
}
function gstPct(a,b){return b>0?Math.round(a/b*1000)/10:null;}
function gstSem(p,meta){if(p===null)return '<span class="gst-pill gst-nd">sem dados</span>';return '<span class="gst-pill '+(p>=meta?'gst-ok':p>=meta-15?'gst-med':'gst-ruim')+'">'+p.toLocaleString('pt-BR')+'%</span>';}
function gstNum(n,kind,eq,mi){return n?'<button type="button" data-gst="'+kind+'" data-eq="'+gstEsc(eq||'')+'" data-mi="'+gstEsc(mi||'')+'">'+n+'</button>':'0';}
function gstStats(recs,ag,hoje){
  const s={tot:recs.length,alto:0,atraso:0,prox:0,semdata:0,emdia:0,comdata:0,faltou:0,agatraso:0};
  recs.forEach(r=>{if(r.risco==='alto')s.alto++;const c=gstClasse(r,hoje);s[c]++;if(c!=='semdata')s.comdata++;});
  ag.forEach(a=>{if(a.ag==='faltou')s.faltou++;else s.agatraso++;});
  s.emdiaPct=gstPct(s.comdata-s.atraso,s.comdata);
  return s;
}
function gstRender(){
  if(!gstRaw)return;
  const hoje=gestHoje(),M=gstMetas();
  const recs=gstFiltrar(gstRecs),ag=gstFiltrar(gstAg),S=gstStats(recs,ag,hoje);
  const filtrado=!!(gstEl('gst-f-equipe').value||gstEl('gst-f-micro').value||gstEl('gst-f-prog').value);
  gstEl('gst-aviso').textContent='Atualizado em '+new Date().toLocaleString('pt-BR')+' · pacientes: todos os cadastros visíveis ao seu login · agenda (faltosos e consultas atrasadas): todas as agendas das equipes · retorno em atraso = data de retorno da última ficha já passou.';
  // KPIs
  const kp=(n,l,c,kind,sub)=>'<button type="button" class="gst-kpi" style="--kc:'+c+'" data-gst="'+kind+'"><b>'+n+'</b><span>'+l+'</span>'+(sub?'<small>'+sub+'</small>':'')+'</button>';
  let h='<div class="gst-kpis">'+
    kp(S.tot,'Estratificados','#455a64','todos','pacientes ativos')+
    kp(S.alto,'Alto risco','#c62828','alto',S.tot?gstPct(S.alto,S.tot)+'% do total':'')+
    kp(S.atraso,'Retornos em atraso','#e65100','atraso','data de retorno vencida')+
    kp(S.prox,'Retornos em 30 dias','#0277bd','prox','pendentes')+
    kp(S.semdata,'Sem data de retorno','#78909c','semdata','completar a ficha')+
    kp(S.faltou,'Faltosos (agenda)','#ad1457','faltou','busca ativa')+
    kp(S.agatraso,'Consultas atrasadas (agenda)','#6a1b9a','agatraso','agendadas já vencidas')+
    '</div>';
  // Retornos em dia vs meta
  h+='<div class="gst-card"><h3>✅ Retornos em dia <span>'+gstSem(S.emdiaPct,M.emdia)+' <small style="font-weight:400">meta '+M.emdia+'%</small></span></h3><div class="gst-card-c">'+
    '<div class="gst-trilho"><div class="gst-fill" style="width:'+(S.emdiaPct||0)+'%;background:'+(S.emdiaPct===null?'#b0bec5':S.emdiaPct>=M.emdia?'#43a047':S.emdiaPct>=M.emdia-15?'#fbc02d':'#e53935')+'"></div></div>'+
    '<div class="gst-aviso" style="margin-top:.4rem">'+(S.comdata-S.atraso)+' de '+S.comdata+' pacientes com data de retorno estão em dia (não vencida).</div></div></div>';
  // Cobertura
  const cob=(lbl,cor,n,base,meta,saiu,nota)=>{
    const metaDin=Math.max(meta-(saiu||0),n),p=meta>0?gstPct(n,metaDin):null;
    return '<div class="gst-barra"><b style="color:'+cor+'">'+lbl+'</b><div class="gst-trilho"><div class="gst-fill" style="width:'+Math.min(100,p||0)+'%;background:'+cor+'"></div></div><small>'+(meta>0&&!filtrado?(n+'/'+metaDin+' · '+gstSem(p,M.cobertura)):n+' estratificado'+(n===1?'':'s'))+'</small></div>'+(saiu&&!filtrado?'<div class="gst-aviso" style="margin:-.2rem 0 .3rem 150px">'+nota+'</div>':'');
  };
  const todos=gstFiltrar(gstRecs);
  const cnt=f=>todos.filter(f).length;
  h+='<div class="gst-card"><h3>📈 Cobertura da estratificação <small style="font-weight:400">'+(filtrado?'(com filtro: só contagem — a meta é do município)':'meta de cobertura: '+M.cobertura+'%')+'</small></h3><div class="gst-card-c">'+
    cob('Hipertensos','#c62828',cnt(r=>r.prog==='hasdm'&&r.diag.includes('HAS')),0,M.his)+
    cob('Diabéticos','#6a1b9a',cnt(r=>r.prog==='hasdm'&&r.diag.includes('DM')),0,M.dia)+
    cob('Idosos','#00796b',cnt(r=>r.prog==='idoso'),0,M.ido,gstSaiu.ido,'Meta ajustada: − '+gstSaiu.ido+' (óbito/saída da lista)')+
    cob('Crianças','#b8860b',cnt(r=>r.prog==='crianca'),0,M.cri,gstSaiu.cri,'Meta ajustada: − '+gstSaiu.cri+' (completaram 6 anos)')+
    cob('Gestantes','#2e7d32',cnt(r=>r.prog==='gestante'),0,M.ges,gstSaiu.ges,'Meta ajustada: − '+gstSaiu.ges+' (puerpério/encerradas)')+
    cob('Saúde bucal','#1565c0',cnt(r=>r.prog==='bucal'),0,M.buc)+
    '</div></div>';
  // por equipe e por microárea
  const agrup=(chave,rot)=>{
    const m={};
    recs.forEach(r=>{const k=chave(r);(m[k]=m[k]||{eq:r.equipe,mi:r.micro,r:[],a:[]}).r.push(r);});
    ag.forEach(a=>{const k=chave(a);(m[k]=m[k]||{eq:a.equipe,mi:a.micro,r:[],a:[]}).a.push(a);});
    return Object.keys(m).map(k=>{const x=m[k];x.nome=rot(x);x.s=gstStats(x.r,x.a,hoje);return x;}).sort((a,b)=>b.s.atraso-a.s.atraso||b.s.tot-a.s.tot);
  };
  const tabela=(titulo,linhas,porMicro)=>{
    if(!linhas.length)return '<div class="gst-card"><h3>'+titulo+'</h3><div class="gst-card-c gst-vazio">Sem dados para os filtros escolhidos.</div></div>';
    const tt=gstStats(recs,ag,hoje);
    const linha=(x,sub)=>{const s=x.s,eq=x.eq,mi=porMicro?x.mi:'';
      return '<tr class="'+(sub?'gst-sub':'')+'"><td>'+gstEsc(x.nome)+'</td><td>'+gstNum(s.tot,'todos',eq,mi)+'</td><td>'+gstNum(s.alto,'alto',eq,mi)+'</td><td>'+gstNum(s.atraso,'atraso',eq,mi)+'</td><td>'+gstNum(s.prox,'prox',eq,mi)+'</td><td>'+gstNum(s.semdata,'semdata',eq,mi)+'</td><td>'+gstNum(s.faltou,'faltou',eq,mi)+'</td><td>'+gstSem(s.emdiaPct,M.emdia)+'</td></tr>';};
    return '<div class="gst-card"><h3>'+titulo+'</h3><div class="tabela-wrap" style="border:0;border-radius:0;max-height:480px;overflow:auto"><table class="gst-tab"><thead><tr><th>'+(porMicro?'Equipe · Microárea':'Equipe')+'</th><th>Estratif.</th><th>Alto risco</th><th>Em atraso</th><th>Próx. 30 d</th><th>Sem data</th><th>Faltosos</th><th>Em dia</th></tr></thead><tbody>'+
      linhas.map(x=>linha(x,false)).join('')+linha({nome:'Total',eq:'',mi:'',s:tt},true)+'</tbody></table></div></div>';
  };
  h+=tabela('👩‍⚕️ Por equipe',agrup(r=>r.equipe,x=>x.eq),false);
  h+=tabela('🗺️ Por microárea',agrup(r=>r.equipe+'|'+r.micro,x=>x.eq+' · '+(x.mi==='—'?'sem microárea':'Microárea '+x.mi)),true);
  // metas
  h+='<div class="gst-card"><h3>🎯 Metas (população-alvo e indicadores) <small style="font-weight:400">salvas neste aparelho</small></h3><div class="gst-card-c"><div class="gst-metas">'+
    [['his','Hipertensos (população-alvo)'],['dia','Diabéticos (população-alvo)'],['ido','Idosos (população-alvo)'],['cri','Crianças (população-alvo)'],['ges','Gestantes (população-alvo)'],['buc','Saúde bucal (população-alvo; 0 = sem meta)'],['emdia','Meta de retornos em dia (%)'],['cobertura','Meta de cobertura (%)']].map(x=>'<div><label>'+x[1]+'</label><input type="number" min="0" id="gst-m-'+x[0]+'" value="'+M[x[0]]+'"></div>').join('')+
    '</div><div style="display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap"><button type="button" class="btn btn-salvar" onclick="gstSalvarMetas()">💾 Salvar metas</button><button type="button" class="btn btn-nova" onclick="gstResetMetas()">↺ Restaurar padrão</button></div></div></div>';
  gstEl('gst-corpo').innerHTML=h;
}
// ---------- detalhe (lista de pacientes) ----------
function gstDetalhe(kind,eq,mi){
  const hoje=gestHoje();
  let base=gstFiltrar(gstRecs),bag=gstFiltrar(gstAg);
  if(eq){base=base.filter(r=>r.equipe===eq);bag=bag.filter(r=>r.equipe===eq);}
  if(mi){base=base.filter(r=>r.micro===mi);bag=bag.filter(r=>r.micro===mi);}
  const T={todos:['Estratificados',()=>true],alto:['Alto risco',r=>r.risco==='alto'],atraso:['Retornos em atraso',r=>gstClasse(r,hoje)==='atraso'],prox:['Retornos nos próximos 30 dias',r=>gstClasse(r,hoje)==='prox'],semdata:['Sem data de retorno',r=>gstClasse(r,hoje)==='semdata']};
  let lista,titulo;
  if(kind==='faltou'||kind==='agatraso'){lista=bag.filter(a=>a.ag===(kind==='faltou'?'faltou':'atrasada'));titulo=kind==='faltou'?'Faltosos (agenda)':'Consultas atrasadas (agenda)';}
  else{const t=T[kind]||T.todos;lista=base.filter(t[1]);titulo=t[0];}
  lista=lista.slice().sort((a,b)=>(a.retorno||'9999').localeCompare(b.retorno||'9999')||String(a.nome).localeCompare(String(b.nome)));
  gstListaAtual=lista;
  const escopo=[eq,mi&&mi!=='—'?'Microárea '+mi:''].filter(Boolean).join(' · ');
  const linhas=lista.map(r=>{
    const d=r.retorno?gstDias(r.retorno):null,at=r.retorno&&r.retorno<hoje;
    const pg=GST_PROG[r.prog]||['','Outro'];
    return '<tr data-n="'+gstEsc((r.nome||'').toLowerCase())+'"><td><b>'+gstEsc(r.nome)+'</b></td><td>'+pg[0]+' '+pg[1]+'</td><td>'+gstEsc(r.equipe)+'</td><td>'+gstEsc(r.micro)+'</td><td>'+gstEsc(GST_RISCO_TXT[r.risco])+'</td><td>'+(r.retorno?gstEsc(gestFmt(r.retorno)):'—')+'</td><td>'+(r.ag?gstEsc(r.status):(at?'<span class="gst-pill gst-ruim">'+d+' d de atraso</span>':(r.retorno?'em dia':'—')))+'</td></tr>';
  }).join('');
  gstEl('gst-modal').innerHTML='<div class="gst-modal-top"><div><h3>'+gstEsc(titulo)+' — '+lista.length+'</h3><small style="color:var(--txt-3)">'+gstEsc(escopo||'Todas as equipes')+'</small></div><div><input type="text" id="gst-busca" placeholder="🔍 Buscar nome…" oninput="gstBuscarLista(this.value)" style="padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px"><button type="button" class="btn btn-nova ag-mini" onclick="gstExportar(\'lista\')">📥 Excel</button><button type="button" class="btn btn-nova ag-mini" onclick="gstImprimirLista(\''+gstEsc(titulo)+'\')">🖨️ Imprimir</button><button type="button" class="btn btn-nova ag-mini" data-gst-fechar="1">✕ Fechar</button></div></div>'+
    (lista.length?'<div class="tabela-wrap" style="max-height:62vh;overflow:auto"><table class="gst-tab" id="gst-tab-lista"><thead><tr><th>Paciente</th><th>Programa</th><th>Equipe</th><th>Microárea</th><th>Risco</th><th>'+(kind==='faltou'||kind==='agatraso'?'Data da consulta':'Retorno')+'</th><th>Situação</th></tr></thead><tbody>'+linhas+'</tbody></table></div>':'<p class="gst-vazio">Nenhum paciente nesta situação 🎉</p>');
  gstEl('gst-ov').classList.add('aberto');
}
function gstDias(iso){return gestDias(iso)==null?0:Math.abs(gestDias(iso));}
function gstBuscarLista(v){const t=(v||'').toLowerCase();document.querySelectorAll('#gst-tab-lista tbody tr').forEach(tr=>{tr.style.display=!t||tr.dataset.n.indexOf(t)>=0?'':'none';});}
function gstFechar(){const o=gstEl('gst-ov');if(o)o.classList.remove('aberto');}
// ---------- exportar / imprimir ----------
function gstBaixar(nome,mime,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function gstLinhaPac(r){return [r.nome,(GST_PROG[r.prog]||['','Outro'])[1],r.equipe,r.micro,GST_RISCO_TXT[r.risco],r.retorno?gestFmt(r.retorno):'',r.ag?r.status:(r.retorno&&r.retorno<gestHoje()?gstDias(r.retorno)+' dias de atraso':(r.retorno?'em dia':'sem data'))];}
function gstExportar(kind){
  if(!gstRaw)return;
  const cab=['Paciente','Programa','Equipe','Microárea','Risco','Data','Situação'];
  const hoje=gestHoje(),recs=gstFiltrar(gstRecs),ag=gstFiltrar(gstAg);
  const abas=kind==='lista'?[['Lista',gstListaAtual]]:[['Estratificados',recs],['Em atraso',recs.filter(r=>gstClasse(r,hoje)==='atraso')],['Proximos 30 dias',recs.filter(r=>gstClasse(r,hoje)==='prox')],['Sem data de retorno',recs.filter(r=>gstClasse(r,hoje)==='semdata')],['Faltosos agenda',ag.filter(a=>a.ag==='faltou')],['Atrasadas agenda',ag.filter(a=>a.ag==='atrasada')]];
  const nome='painel-gestor-'+hoje+'.';
  if(window.XLSX&&XLSX.utils){
    const wb=XLSX.utils.book_new();
    abas.forEach(a=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([cab].concat(a[1].map(gstLinhaPac))),a[0].slice(0,31)));
    XLSX.writeFile(wb,nome+'xlsx');
  }else{
    const csv=abas.map(a=>'## '+a[0]+'\n'+[cab].concat(a[1].map(gstLinhaPac)).map(l=>l.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n')).join('\n\n');
    gstBaixar(nome+'csv','text/csv;charset=utf-8','﻿'+csv);
  }
}
function gstJanelaImp(titulo,corpo){
  const w=window.open('','_blank');if(!w){showToast('Libere pop-ups para imprimir',true);return;}
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+gstEsc(titulo)+'</title><style>body{font-family:Arial,sans-serif;font-size:11px;color:#000;padding:16px 22px}h1{font-size:16px;margin:0}small{color:#555}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #999;padding:3px 5px;text-align:left}th{background:#eee}.gst-card{margin:10px 0;break-inside:avoid}.gst-card>h3{background:#eceff1;margin:0;padding:5px 8px;font-size:12px}.gst-kpis{display:flex;flex-wrap:wrap;gap:6px}.gst-kpi{border:1px solid #999;padding:5px 8px;border-top:3px solid #455a64;min-width:110px;background:#fff}.gst-kpi b{display:block;font-size:18px}.gst-barra{display:grid;grid-template-columns:120px 1fr 120px;gap:6px;margin:3px 0;align-items:center}.gst-trilho{background:#eee;height:10px;border-radius:5px}.gst-fill{height:10px;border-radius:5px}.gst-pill{font-weight:bold}.gst-metas,button[onclick],.gst-card:last-child{display:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body><h1>Secretaria de Saúde de Alto Alegre do Maranhão — '+gstEsc(titulo)+'</h1><small>Emitido em '+new Date().toLocaleString('pt-BR')+'</small>'+corpo+'<script>window.onload=function(){setTimeout(function(){window.print()},250)}<\/script></body></html>');
  w.document.close();
}
function gstImprimir(){gstJanelaImp('Painel do Gestor',gstEl('gst-corpo').innerHTML.replace(/<button[^>]*>(.*?)<\/button>/g,'$1'));}
function gstImprimirLista(t){const tb=gstEl('gst-tab-lista');gstJanelaImp(t,tb?tb.outerHTML:'<p>Nenhum paciente.</p>');}


// ===== LOGIN E PROTEÇÃO =====
let gstOciosoT=null;
function gstEmail(u){u=String(u||'').trim().toLowerCase();return u.indexOf('@')>=0?u:u+'@'+APS_EMAIL_DOMINIO;}
function gstMostrarLogin(msg){
  document.getElementById('tela-painel-g').style.display='none';document.getElementById('tela-login-g').style.display='flex';
  const e=document.getElementById('lg-erro');if(msg){e.textContent=msg;e.style.display='block';}else e.style.display='none';
  gstRaw=null;gstRecs=[];gstAg=[];clearTimeout(gstOciosoT);
}
async function gstEhGestor(){
  const r=await supabaseClient.rpc('eh_gestor');
  return !r.error&&r.data===true;
}
async function gstEntrar(user){
  document.getElementById('tela-login-g').style.display='none';document.getElementById('tela-painel-g').style.display='block';
  const n=document.getElementById('gst-nome-user');if(n)n.textContent=(user&&user.email?user.email.split('@')[0]:'');
  gstOciosoReiniciar();
  await gstAbrir();
}
async function gstLogin(){
  const u=document.getElementById('lg-user').value,p=document.getElementById('lg-pass').value,btn=document.getElementById('lg-btn');
  if(!u.trim()||!p){gstMostrarLogin('Preencha usuário e senha');return;}
  btn.disabled=true;btn.textContent='Entrando…';
  try{
    const r=await supabaseClient.auth.signInWithPassword({email:gstEmail(u),password:p});
    if(r.error||!r.data||!r.data.user){document.getElementById('lg-pass').value='';gstMostrarLogin('Usuário ou senha incorretos');return;}
    if(!(await gstEhGestor())){await supabaseClient.auth.signOut();document.getElementById('lg-pass').value='';gstMostrarLogin('Este usuário não tem permissão de gestor.');return;}
    document.getElementById('lg-pass').value='';
    await gstEntrar(r.data.user);
  }catch(err){gstMostrarLogin('Não foi possível entrar. Tente novamente.');}
  finally{btn.disabled=false;btn.textContent='Entrar no painel →';}
}
async function gstSair(){try{await supabaseClient.auth.signOut();}catch(e){}gstMostrarLogin('');}
// sai sozinho após 30 minutos sem uso
function gstOciosoReiniciar(){clearTimeout(gstOciosoT);gstOciosoT=setTimeout(()=>{gstSair();gstMostrarLogin('Sessão encerrada por inatividade.');},30*60*1000);}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(gstRaw)gstOciosoReiniciar();},{passive:true}));
supabaseClient.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')gstMostrarLogin('');});
(async function(){
  try{
    const s=await supabaseClient.auth.getSession();
    const u=s&&s.data&&s.data.session&&s.data.session.user;
    if(u&&await gstEhGestor()){await gstEntrar(u);return;}
    if(u)await supabaseClient.auth.signOut();
  }catch(e){}
  gstMostrarLogin('');
})();
</script>
